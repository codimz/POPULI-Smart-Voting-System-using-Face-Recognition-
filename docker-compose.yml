services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: populi-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: populi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voting_system
      POSTGRES_USER: populi
      POSTGRES_PASSWORD: populi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_model_alignment.sql:/docker-entrypoint-initdb.d/002_model_alignment.sql:ro
      - ./database/migrations/003_role_and_receipt.sql:/docker-entrypoint-initdb.d/003_role_and_receipt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U populi -d voting_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: populi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: populi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://populi:populi_dev_password@postgres:5432/voting_system
      - DATABASE_URL_SYNC=postgresql://populi:populi_dev_password@postgres:5432/voting_system
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - SQL_ECHO=false
      - DEBUG=false
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: