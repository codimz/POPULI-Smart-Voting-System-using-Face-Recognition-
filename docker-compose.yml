services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: populi-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: populi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voting_system
      POSTGRES_USER: populi
      POSTGRES_PASSWORD: populi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U populi -d voting_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: