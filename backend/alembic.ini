# T23: Alembic configuration (async)
[alembic]
script_location = alembic
prepend_sys_path = .
version_path = alembic/versions
sqlalchemy.url = postgresql+asyncpg://populi:populi_dev_password@localhost:5432/voting_system

[post_write_hooks]
# Optional: generate rev id

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
